<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AKAN NAME GENERATOR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>Akan Name Generator</h1>
    <p>Welcome to the <mark> <strong> Akan Name Generator! </strong></mark> Enter your birth date and select your gender to discover your traditional Akan name based on the day of the week you were born.</p>
    <form id="akanForm">
        <label>Day:</label>
        <input type="number" id="day" placeholder="Day" required>

        <label>Month:</label>
        <input type="number" id="month" placeholder="Month" required>

        <label>Year:</label>
        <input type="number" id="year" placeholder="Year" required>

        
       <div class="gender">
        <label>Gender:</label><br><br>
           
      Male  <input type="radio" name="gender" value="male"> 
      Female  <input type="radio" name="gender" value="female"> 
      
       </div>
        <br><br>

        <button type="button" onclick="generateName()">Generate Name</button>
    </form>

    <h2 id="result"></h2>
</div>


<script src="script.js"></script>


</body>
</html>
